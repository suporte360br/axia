# Atualiza as páginas fixas das vagas aprovadas (portal de recrutamento).
# A cada 30 minutos lê as vagas aprovadas no Supabase, gera o site e publica se algo mudou.
# A consulta frequente também mantém o projeto do Supabase ativo (o plano gratuito pausa projetos parados).
name: Atualizar vagas

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-vagas
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar o site com as vagas aprovadas
        run: node gerador/gerar.js

      - name: Publicar se houve mudança
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Atualiza as vagas publicadas"
            git push
          else
            echo "Nenhuma vaga nova ou encerrada."
          fi
